<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRDL</title>
  <style>
    :root {
      --bg: #0d0b1a;
      --card: #16122b;
      --card-hover: #1e1838;
      --border: #2e2650;
      --accent: #7b5cff;
      --accent2: #00e5ff;
      --text: #e8e4f5;
      --muted: #9b93b8;
      --success: #00e676;
      --danger: #ff5252;
      --star: #ffd54f;
      --demon: #ff4081;
      --moon: #82b1ff;
      --drag: #3d2e6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -20%, rgba(123, 92, 255, 0.25), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(0, 229, 255, 0.12), transparent);
    }
    .container {
      position: relative; z-index: 1;
      max-width: 1200px; margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    header { text-align: center; margin-bottom: 1rem; }
    header h1 {
      font-size: 2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { color: var(--muted); margin-top: 0.35rem; font-size: 0.95rem; }

    .top-bar {
      display: flex; justify-content: center; align-items: center;
      gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.25rem;
    }
    .admin-badge {
      background: rgba(0, 230, 118, 0.15);
      border: 1px solid var(--success);
      color: var(--success);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .admin-badge.guest {
      background: rgba(155, 147, 184, 0.15);
      border-color: var(--border);
      color: var(--muted);
    }

    .tabs {
      display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem;
    }
    .tab-btn {
      background: var(--card); border: 1px solid var(--border);
      color: var(--muted); padding: 0.6rem 1.4rem; border-radius: 999px;
      font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s;
    }
    .tab-btn:hover { color: var(--text); border-color: var(--accent); }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent), #5a3fd4);
      border-color: transparent; color: white;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .controls {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      align-items: center; justify-content: center;
      margin-bottom: 1.25rem;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 1rem 1.25rem;
    }
    .add-form, .level-search-wrap {
      display: flex; gap: 0.5rem; flex: 1;
      min-width: 240px; max-width: 420px;
    }
    .level-search-wrap { position: relative; max-width: 480px; }
    input[type="text"], input[type="password"], select {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); padding: 0.65rem 1rem; border-radius: 10px;
      font-size: 0.95rem; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); }

    button {
      cursor: pointer; border: none; border-radius: 10px;
      font-weight: 600; font-size: 0.9rem;
      padding: 0.65rem 1.1rem;
      transition: transform 0.15s, background 0.2s, opacity 0.2s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #5a3fd4); color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #8f74ff, var(--accent));
    }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-secondary:hover:not(:disabled) { background: #3d3468; }
    .btn-danger {
      background: transparent; color: var(--danger);
      border: 1px solid var(--danger); padding: 0.35rem 0.7rem; font-size: 0.8rem;
    }
    .btn-danger:hover { background: rgba(255, 82, 82, 0.15); }

    .view-toggle, .sort-controls, .insert-controls {
      display: flex; gap: 0.4rem; align-items: center;
    }
    .view-toggle button, .sort-controls select, .insert-controls select {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); padding: 0.5rem 0.85rem; border-radius: 8px; font-size: 0.85rem;
    }
    .view-toggle button.active {
      background: var(--accent); border-color: var(--accent); color: white;
    }
    .insert-controls label { font-size: 0.85rem; color: var(--muted); }
    .insert-controls select { width: auto; min-width: 90px; }

    .status {
      text-align: center; min-height: 1.5rem; margin-bottom: 1rem;
      font-size: 0.9rem; color: var(--muted);
    }
    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 1.25rem;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }
    .card:hover {
      background: var(--card-hover); border-color: var(--accent); transform: translateY(-2px);
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 1rem; gap: 0.75rem;
    }
    .card-pos {
      font-size: 1.35rem; font-weight: 800; min-width: 2rem; text-align: center;
      color: var(--accent2); font-variant-numeric: tabular-nums; line-height: 1.1; flex-shrink: 0;
    }
    .card-pos.gold { color: #ffd700; }
    .card-pos.silver { color: #c0c0c0; }
    .card-pos.bronze { color: #cd7f32; }
    .card-name { font-size: 1.15rem; font-weight: 700; word-break: break-word; }
    .card-rank { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }
    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem 1rem;
    }
    .stat { display: flex; flex-direction: column; }
    .stat-label {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
    }
    .stat-value { font-size: 1.15rem; font-weight: 700; }
    .stat-value.stars { color: var(--star); }
    .stat-value.demons { color: var(--demon); }
    .stat-value.moons { color: var(--moon); }
    .card-footer {
      margin-top: 1rem; padding-top: 0.85rem; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.8rem; color: var(--muted);
    }

    .table-wrap {
      overflow-x: auto; border-radius: 16px;
      border: 1px solid var(--border); background: var(--card);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { padding: 0.85rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
    th {
      background: rgba(123, 92, 255, 0.12); color: var(--muted);
      font-weight: 600; font-size: 0.78rem; text-transform: uppercase;
      letter-spacing: 0.04em; cursor: pointer; user-select: none; white-space: nowrap;
    }
    th:hover { color: var(--text); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(123, 92, 255, 0.06); }
    td.num { font-variant-numeric: tabular-nums; font-weight: 600; }
    td.stars { color: var(--star); }
    td.demons { color: var(--demon); }
    td.moons { color: var(--moon); }
    td.pos-num {
      font-weight: 800; font-size: 1.05rem; color: var(--accent2);
      font-variant-numeric: tabular-nums; width: 2.5rem;
    }
    td.pos-num.gold { color: #ffd700; }
    td.pos-num.silver { color: #c0c0c0; }
    td.pos-num.bronze { color: #cd7f32; }

    .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); }
    .loading-spinner {
      display: inline-block; width: 1rem; height: 1rem;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .search-results {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; max-height: 320px; overflow-y: auto;
      z-index: 50; display: none; box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    }
    .search-results.show { display: block; }
    .search-item {
      padding: 0.7rem 1rem; cursor: pointer; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; gap: 0.75rem; align-items: center;
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background: var(--card-hover); }
    .search-item-name { font-weight: 600; }
    .search-item-meta { font-size: 0.8rem; color: var(--muted); }
    .search-item-diff {
      font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 6px;
      background: rgba(123,92,255,0.2); white-space: nowrap;
    }

    .ranked-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .rank-item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.85rem 1rem;
      display: flex; align-items: center; gap: 0.9rem;
      user-select: none; transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .rank-item.draggable { cursor: grab; }
    .rank-item.draggable:active { cursor: grabbing; }
    .rank-item.dragging { opacity: 0.55; border-color: var(--accent); background: var(--drag); }
    .rank-item.drag-over {
      border-color: var(--accent2);
      box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.25);
    }
    .rank-pos {
      font-size: 1.25rem; font-weight: 800; min-width: 2.2rem; text-align: center;
      color: var(--accent2); font-variant-numeric: tabular-nums;
    }
    .rank-pos.gold { color: #ffd700; }
    .rank-pos.silver { color: #c0c0c0; }
    .rank-pos.bronze { color: #cd7f32; }
    .rank-info { flex: 1; min-width: 0; }
    .rank-name {
      font-weight: 700; font-size: 1.05rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rank-meta { font-size: 0.8rem; color: var(--muted); margin-top: 0.1rem; }
    .drag-handle { color: var(--muted); font-size: 1.1rem; padding: 0.2rem; }
    .level-hint {
      text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem;
    }

    /* Login modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      z-index: 100; display: none; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 1.75rem; width: 100%; max-width: 360px;
    }
    .modal h2 { margin-bottom: 0.5rem; font-size: 1.25rem; }
    .modal p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
    .modal form { display: flex; flex-direction: column; gap: 0.75rem; }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 0.5rem; }

    .admin-only { display: none; }
    body.is-admin .admin-only { display: flex; }
    body.is-admin .admin-only-inline { display: inline-flex; }
    body.is-admin .admin-only-block { display: block; }

    footer {
      text-align: center; margin-top: 2.5rem; font-size: 0.8rem; color: var(--muted);
    }
    footer a { color: var(--accent2); text-decoration: none; }

    @media (max-width: 600px) {
      header h1 { font-size: 1.6rem; }
      .controls { flex-direction: column; align-items: stretch; }
      .add-form, .level-search-wrap { max-width: none; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <header>
      <h1>FRDL</h1>
      <p>Friends Rankings &amp; Demon List</p>
    </header>

    <div class="top-bar">
      <span class="admin-badge guest" id="authBadge">Viewing only</span>
      <button type="button" class="btn-secondary" id="loginBtn">Admin login</button>
      <button type="button" class="btn-secondary admin-only" id="logoutBtn" style="display:none">Log out</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="friends">Friends</button>
      <button class="tab-btn" data-tab="levels">Level Rankings</button>
    </div>

    <!-- FRIENDS -->
    <div id="tab-friends" class="tab-panel active">
      <div class="controls">
        <form class="add-form admin-only" id="addForm" style="display:none">
          <input type="text" id="usernameInput" placeholder="GD username…" autocomplete="off" spellcheck="false" />
          <button type="submit" class="btn-primary" id="addBtn">Add</button>
        </form>
        <div class="view-toggle">
          <button type="button" id="btnCards" class="active">Cards</button>
          <button type="button" id="btnTable">Table</button>
        </div>
        <div class="sort-controls">
          <label for="sortSelect" style="font-size:0.85rem;color:var(--muted)">Sort</label>
          <select id="sortSelect">
            <option value="stars-desc">Stars ↓</option>
            <option value="stars-asc">Stars ↑</option>
            <option value="demons-desc">Demons ↓</option>
            <option value="demons-asc">Demons ↑</option>
            <option value="moons-desc">Moons ↓</option>
            <option value="moons-asc">Moons ↑</option>
            <option value="rank-asc">Rank (best)</option>
            <option value="rank-desc">Rank (worst)</option>
            <option value="name-asc">Name A–Z</option>
            <option value="name-desc">Name Z–A</option>
          </select>
        </div>
        <button type="button" class="btn-secondary admin-only" id="refreshBtn" style="display:none" title="Refresh all stats">↻ Refresh</button>
      </div>
      <div class="status" id="status"></div>
      <div id="content"><div class="empty">Loading…</div></div>
    </div>

    <!-- LEVELS -->
    <div id="tab-levels" class="tab-panel">
      <div class="controls admin-only" id="levelControls" style="display:none">
        <div class="level-search-wrap">
          <input type="text" id="levelSearchInput" placeholder="Search levels by name…" autocomplete="off" spellcheck="false" />
          <div class="search-results" id="searchResults"></div>
        </div>
        <div class="insert-controls">
          <label for="insertPos">Place at</label>
          <select id="insertPos"><option value="end">End of list</option></select>
          <button type="button" class="btn-primary" id="addLevelBtn" disabled>Add Level</button>
        </div>
      </div>
      <div class="status" id="levelStatus"></div>
      <p class="level-hint admin-only" id="levelHint" style="display:none">Drag rows to reorder · Inserting at a rank pushes lower ones down</p>
      <div id="levelContent"><div class="empty">Loading…</div></div>
    </div>

    <footer>
      Data via <a href="https://gdbrowser.com" target="_blank" rel="noopener">GDBrowser</a>
    </footer>
  </div>

  <!-- Login modal -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal">
      <h2>Admin login</h2>
      <p>Enter the password to add friends, levels, and reorder rankings.</p>
      <form id="loginForm">
        <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password" />
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelLogin">Cancel</button>
          <button type="submit" class="btn-primary">Log in</button>
        </div>
      </form>
      <div class="status" id="loginStatus" style="margin-top:0.75rem;margin-bottom:0"></div>
    </div>
  </div>

  <script>
    const API = '/api';
    const GDB_PROFILE = 'https://gdbrowser.com/api/profile/';
    const GDB_SEARCH = 'https://gdbrowser.com/api/search/';
    const TOKEN_KEY = 'frdl_admin_token';

    let friends = [];       // { id, username, profile }
    let rankedLevels = [];  // from DB
    let viewMode = 'cards';
    let sortKey = 'stars-desc';
    let isAdmin = false;
    let selectedLevel = null;
    let searchTimeout = null;
    let dragSrcIndex = null;

    const content = document.getElementById('content');
    const statusEl = document.getElementById('status');
    const levelContent = document.getElementById('levelContent');
    const levelStatus = document.getElementById('levelStatus');
    const authBadge = document.getElementById('authBadge');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginModal = document.getElementById('loginModal');
    const passwordInput = document.getElementById('passwordInput');
    const loginStatus = document.getElementById('loginStatus');

    function token() { return localStorage.getItem(TOKEN_KEY) || ''; }

    function setAdminUI(on) {
      isAdmin = on;
      document.body.classList.toggle('is-admin', on);
      authBadge.textContent = on ? 'Admin mode' : 'Viewing only';
      authBadge.classList.toggle('guest', !on);
      loginBtn.style.display = on ? 'none' : '';
      logoutBtn.style.display = on ? '' : 'none';

      // Show/hide admin controls
      document.querySelectorAll('.admin-only').forEach(el => {
        if (el.id === 'logoutBtn') return;
        el.style.display = on ? (el.classList.contains('add-form') || el.id === 'levelControls' ? 'flex' : '') : 'none';
      });
      const addForm = document.getElementById('addForm');
      const levelControls = document.getElementById('levelControls');
      const levelHint = document.getElementById('levelHint');
      const refreshBtn = document.getElementById('refreshBtn');
      if (addForm) addForm.style.display = on ? 'flex' : 'none';
      if (levelControls) levelControls.style.display = on ? 'flex' : 'none';
      if (levelHint) levelHint.style.display = on ? 'block' : 'none';
      if (refreshBtn) refreshBtn.style.display = on ? '' : 'none';

      renderFriends();
      renderLevels();
    }

    async function api(path, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (token()) headers['Authorization'] = 'Bearer ' + token();
      let res;
      try {
        res = await fetch(API + path, { cache: 'no-store', ...options, headers });
      } catch (networkErr) {
        throw new Error('Network error – could not reach /api' + path);
      }
      const text = await res.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text.slice(0, 200) }; }
      if (!res.ok) {
        const msg = data.error || data.message || ('HTTP ' + res.status + ' on /api' + path);
        const err = new Error(msg);
        err.status = res.status;
        throw err;
      }
      return data;
    }

    // ===== Auth =====
    loginBtn.addEventListener('click', () => {
      loginModal.classList.add('show');
      passwordInput.value = '';
      loginStatus.textContent = '';
      setTimeout(() => passwordInput.focus(), 50);
    });
    document.getElementById('cancelLogin').addEventListener('click', () => {
      loginModal.classList.remove('show');
    });
    loginModal.addEventListener('click', e => {
      if (e.target === loginModal) loginModal.classList.remove('show');
    });
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      loginStatus.innerHTML = '<span class="loading-spinner"></span>Checking…';
      try {
        const data = await api('/login', {
          method: 'POST',
          body: JSON.stringify({ password: passwordInput.value })
        });
        localStorage.setItem(TOKEN_KEY, data.token);
        loginModal.classList.remove('show');
        setAdminUI(true);
        setStatus('Logged in as admin', 'success');
      } catch (err) {
        loginStatus.className = 'status error';
        loginStatus.textContent = err.message || 'Login failed';
      }
    });
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem(TOKEN_KEY);
      setAdminUI(false);
      setStatus('Logged out', 'success');
    });

    // ===== Tabs =====
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    // ===== Helpers =====
    function setStatus(msg, type, loading = false) {
      statusEl.className = 'status' + (type ? ' ' + type : '');
      statusEl.innerHTML = loading ? `<span class="loading-spinner"></span>${msg}` : msg;
    }
    function setLevelStatus(msg, type, loading = false) {
      levelStatus.className = 'status' + (type ? ' ' + type : '');
      levelStatus.innerHTML = loading ? `<span class="loading-spinner"></span>${msg}` : msg;
    }
    function formatNum(n) {
      if (n == null) return '—';
      return Number(n).toLocaleString();
    }
    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escapeAttr(str) { return escapeHtml(str).replace(/'/g, '&#39;'); }
    function posClass(i) {
      if (i === 0) return 'gold';
      if (i === 1) return 'silver';
      if (i === 2) return 'bronze';
      return '';
    }
    function profileOf(f) {
      return f.profile && typeof f.profile === 'object' ? f.profile : {};
    }
    function displayName(f) {
      const p = f._p || profileOf(f);
      return p.username || f.username || '';
    }
    function timeAgo(iso) {
      if (!iso) return '';
      const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
      if (s < 45) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      return Math.floor(s / 86400) + 'd ago';
    }
    function latestUpdatedLabel() {
      if (!friends.length) return '';
      let latest = 0;
      for (const f of friends) {
        const t = new Date(f.updated_at).getTime();
        if (Number.isFinite(t) && t > latest) latest = t;
      }
      return latest ? 'updated ' + timeAgo(new Date(latest).toISOString()) : '';
    }

    // ===== Friends data =====
    async function loadFriends() {
      try {
        const data = await api('/friends');
        friends = data.friends || [];
        // Seed starter if empty and admin
        if (friends.length === 0 && isAdmin) {
          await seedStarter();
        } else if (friends.length === 0 && !isAdmin) {
          // Try seed via public? No - only admin. Show empty.
        }
        renderFriends();
      } catch (err) {
        setStatus(err.message || 'Failed to load friends', 'error');
        content.innerHTML = '<div class="empty">Could not load data. Check that the site is set up correctly.</div>';
      }
    }

    async function seedStarter() {
      try {
        setStatus('Adding starter profile…', null, true);
        const profile = await fetchProfile('TheRealpeanutGD');
        await api('/friends', {
          method: 'POST',
          body: JSON.stringify({ username: profile.username, profile })
        });
        const data = await api('/friends');
        friends = data.friends || [];
        setStatus('Added TheRealpeanutGD', 'success');
      } catch (e) {
        console.warn('Seed failed', e);
      }
    }

    async function fetchProfile(username, accountID, playerID) {
      const attempts = [];
      if (accountID) attempts.push(GDB_PROFILE + encodeURIComponent(accountID) + '?t=' + Date.now());
      if (username) attempts.push(GDB_PROFILE + encodeURIComponent(username.trim()) + '?t=' + Date.now());
      if (playerID) attempts.push(GDB_PROFILE + encodeURIComponent(playerID) + '?player=1&t=' + Date.now());
      if (!attempts.length) throw new Error('Username required');

      let lastErr = null;
      for (const url of attempts) {
        try {
          const res = await fetch(url, { cache: 'no-store' });
          if (!res.ok) {
            lastErr = new Error(res.status === 404 || res.status === 400 ? 'User not found' : 'Request failed (' + res.status + ')');
            continue;
          }
          const data = await res.json();
          if (!data || !data.username) {
            lastErr = new Error('User not found');
            continue;
          }
          return data;
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error('User not found');
    }

    async function addUser(username) {
      const name = username.trim();
      if (!name) return;
      if (friends.some(f => (f.username || '').toLowerCase() === name.toLowerCase())) {
        setStatus('Already in the list', 'error');
        return;
      }
      setStatus('Fetching…', null, true);
      document.getElementById('addBtn').disabled = true;
      try {
        const profile = await fetchProfile(name);
        await api('/friends', {
          method: 'POST',
          body: JSON.stringify({ username: profile.username, profile })
        });
        document.getElementById('usernameInput').value = '';
        setStatus(`Added ${profile.username}`, 'success');
        await loadFriends();
      } catch (err) {
        setStatus(err.message || 'Failed to add', 'error');
      } finally {
        document.getElementById('addBtn').disabled = false;
      }
    }

    async function removeUser(id) {
      if (!confirm('Remove this friend?')) return;
      try {
        await api('/friends', { method: 'DELETE', body: JSON.stringify({ id }) });
        setStatus('Removed', 'success');
        await loadFriends();
      } catch (err) {
        setStatus(err.message || 'Failed to remove', 'error');
      }
    }

    async function liveRefresh({ force = false, quiet = false } = {}) {
      if (!friends.length) return;
      if (!quiet) setStatus('Updating live stats…', null, true);
      try {
        const data = await api('/refresh' + (force ? '?force=1' : ''), { method: 'POST' });
        friends = data.friends || friends;
        renderFriends();
        const ago = latestUpdatedLabel();
        if (data.errors) {
          setStatus(`Updated ${data.updated || 0}, ${data.errors} failed` + (ago ? ' · ' + ago : ''), 'error');
        } else {
          setStatus((force ? 'All stats refreshed' : 'Live stats') + (ago ? ' · ' + ago : ''), 'success');
        }
      } catch (err) {
        if (!quiet) setStatus(err.message || 'Live update failed', 'error');
      }
    }

    async function refreshAll() {
      if (!friends.length) {
        setStatus('Nothing to refresh', 'error');
        return;
      }
      const btn = document.getElementById('refreshBtn');
      if (btn) btn.disabled = true;
      await liveRefresh({ force: true });
      if (btn) btn.disabled = false;
    }

    function sortedFriends() {
      const list = friends.map(f => {
        const p = profileOf(f);
        return {
          ...f,
          _stars: p.stars ?? 0,
          _demons: p.demons ?? 0,
          _moons: p.moons ?? 0,
          _rank: p.rank || 99999999,
          _name: (p.username || f.username || '').toLowerCase(),
          _p: p
        };
      });
      const [key, dir] = sortKey.split('-');
      list.sort((a, b) => {
        if (key === 'name') {
          return dir === 'asc' ? a._name.localeCompare(b._name) : b._name.localeCompare(a._name);
        }
        const map = { stars: '_stars', demons: '_demons', moons: '_moons', rank: '_rank' };
        const k = map[key] || '_stars';
        return dir === 'asc' ? a[k] - b[k] : b[k] - a[k];
      });
      return list;
    }

    function renderFriends() {
      const list = sortedFriends();
      if (!list.length) {
        content.innerHTML = `<div class="empty">${isAdmin ? 'Add a Geometry Dash username to get started.' : 'No friends listed yet.'}</div>`;
        return;
      }
      if (viewMode === 'cards') {
        content.innerHTML = `<div class="cards">${list.map((f, i) => {
          const p = f._p;
          return `
          <div class="card">
            <div class="card-header">
              <span class="card-pos ${posClass(i)}">${i + 1}</span>
              <div style="flex:1;min-width:0">
                <div class="card-name">${escapeHtml(displayName(f))}</div>
                <div class="card-rank">Global #${formatNum(p.rank)}</div>
              </div>
              ${isAdmin ? `<button class="btn-danger" onclick="removeUser('${escapeAttr(f.id)}')">Remove</button>` : ''}
            </div>
            <div class="stats-grid">
              <div class="stat"><span class="stat-label">Stars</span><span class="stat-value stars">${formatNum(p.stars)}</span></div>
              <div class="stat"><span class="stat-label">Demons</span><span class="stat-value demons">${formatNum(p.demons)}</span></div>
              <div class="stat"><span class="stat-label">Moons</span><span class="stat-value moons">${formatNum(p.moons)}</span></div>
              <div class="stat"><span class="stat-label">Diamonds</span><span class="stat-value">${formatNum(p.diamonds)}</span></div>
              <div class="stat"><span class="stat-label">User Coins</span><span class="stat-value">${formatNum(p.userCoins)}</span></div>
              <div class="stat"><span class="stat-label">Secret Coins</span><span class="stat-value">${formatNum(p.coins)}</span></div>
              <div class="stat"><span class="stat-label">Creator Points</span><span class="stat-value">${formatNum(p.cp)}</span></div>
              <div class="stat"><span class="stat-label">Account ID</span><span class="stat-value" style="font-size:0.95rem">${p.accountID ?? '—'}</span></div>
            </div>
            <div class="card-footer">
              <span>Player ID ${p.playerID ?? '—'} · ${escapeHtml(timeAgo(f.updated_at) || 'not yet updated')}</span>
              ${p.youtube ? `<a href="${escapeAttr(p.youtubeURL || 'https://youtube.com/@' + p.youtube)}" target="_blank" rel="noopener" style="color:var(--accent2)">YouTube</a>` : ''}
            </div>
          </div>`;
        }).join('')}</div>`;
      } else {
        content.innerHTML = `
        <div class="table-wrap"><table>
          <thead><tr>
            <th style="width:2.5rem">#</th>
            <th data-sort="name">Username</th>
            <th data-sort="stars">Stars</th>
            <th data-sort="demons">Demons</th>
            <th data-sort="moons">Moons</th>
            <th data-sort="diamonds">Diamonds</th>
            <th data-sort="userCoins">User Coins</th>
            <th data-sort="cp">CP</th>
            <th data-sort="rank">Global Rank</th>
            ${isAdmin ? '<th></th>' : ''}
          </tr></thead>
          <tbody>
            ${list.map((f, i) => {
              const p = f._p;
              return `<tr>
                <td class="pos-num ${posClass(i)}">${i + 1}</td>
                <td><strong>${escapeHtml(displayName(f))}</strong></td>
                <td class="num stars">${formatNum(p.stars)}</td>
                <td class="num demons">${formatNum(p.demons)}</td>
                <td class="num moons">${formatNum(p.moons)}</td>
                <td class="num">${formatNum(p.diamonds)}</td>
                <td class="num">${formatNum(p.userCoins)}</td>
                <td class="num">${formatNum(p.cp)}</td>
                <td class="num">#${formatNum(p.rank)}</td>
                ${isAdmin ? `<td><button class="btn-danger" onclick="removeUser('${escapeAttr(f.id)}')">✕</button></td>` : ''}
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>`;
        content.querySelectorAll('th[data-sort]').forEach(th => {
          th.addEventListener('click', () => {
            const key = th.dataset.sort;
            const current = sortKey.split('-');
            const nextDir = (current[0] === key && current[1] === 'desc') ? 'asc' : 'desc';
            sortKey = `${key}-${nextDir}`;
            document.getElementById('sortSelect').value = sortKey;
            renderFriends();
          });
        });
      }
    }

    // ===== Levels =====
    async function loadLevels() {
      try {
        const data = await api('/levels');
        rankedLevels = data.levels || [];
        updateInsertOptions();
        renderLevels();
      } catch (err) {
        setLevelStatus(err.message || 'Failed to load levels', 'error');
        levelContent.innerHTML = '<div class="empty">Could not load levels.</div>';
      }
    }

    function updateInsertOptions() {
      const len = rankedLevels.length;
      let html = '<option value="end">End of list</option>';
      for (let i = 1; i <= len + 1; i++) {
        const s = i === 1 ? 'st' : i === 2 ? 'nd' : i === 3 ? 'rd' : 'th';
        html += `<option value="${i}">${i}${s}</option>`;
      }
      document.getElementById('insertPos').innerHTML = html;
    }

    async function searchLevels(query) {
      const box = document.getElementById('searchResults');
      if (!query || query.length < 1) {
        box.classList.remove('show');
        box.innerHTML = '';
        return;
      }
      try {
        const res = await fetch(GDB_SEARCH + encodeURIComponent(query));
        if (!res.ok) throw new Error('Search failed');
        const data = await res.json();
        const results = Array.isArray(data) ? data.slice(0, 12) : [];
        if (!results.length) {
          box.innerHTML = '<div class="search-item" style="cursor:default;color:var(--muted)">No levels found</div>';
          box.classList.add('show');
          return;
        }
        box.innerHTML = results.map(lv => `
          <div class="search-item" data-id="${escapeAttr(lv.id)}" data-name="${escapeAttr(lv.name)}">
            <div>
              <div class="search-item-name">${escapeHtml(lv.name)}</div>
              <div class="search-item-meta">by ${escapeHtml(lv.author || '?')} · ID ${lv.id}</div>
            </div>
            <span class="search-item-diff">${escapeHtml(lv.difficulty || '')}</span>
          </div>`).join('');
        box.classList.add('show');
        box.querySelectorAll('.search-item[data-id]').forEach(el => {
          el.addEventListener('click', () => {
            const found = results.find(r => String(r.id) === el.dataset.id);
            selectedLevel = {
              level_id: el.dataset.id,
              name: el.dataset.name,
              author: found?.author || '',
              difficulty: found?.difficulty || '',
              stars: found?.stars ?? null
            };
            document.getElementById('levelSearchInput').value = selectedLevel.name;
            box.classList.remove('show');
            document.getElementById('addLevelBtn').disabled = false;
            setLevelStatus(`Selected: ${selectedLevel.name}`, 'success');
          });
        });
      } catch (err) {
        setLevelStatus(err.message || 'Search error', 'error');
      }
    }

    async function addLevelAtPosition() {
      if (!selectedLevel) {
        setLevelStatus('Select a level first', 'error');
        return;
      }
      const posVal = document.getElementById('insertPos').value;
      setLevelStatus('Adding…', null, true);
      try {
        await api('/levels', {
          method: 'POST',
          body: JSON.stringify({
            level: selectedLevel,
            position: posVal === 'end' ? null : posVal
          })
        });
        selectedLevel = null;
        document.getElementById('levelSearchInput').value = '';
        document.getElementById('addLevelBtn').disabled = true;
        setLevelStatus('Level added', 'success');
        await loadLevels();
      } catch (err) {
        setLevelStatus(err.message || 'Failed to add', 'error');
      }
    }

    async function removeLevel(id) {
      if (!confirm('Remove this level from the ranking?')) return;
      try {
        await api('/levels', { method: 'DELETE', body: JSON.stringify({ id }) });
        setLevelStatus('Removed', 'success');
        await loadLevels();
      } catch (err) {
        setLevelStatus(err.message || 'Failed', 'error');
      }
    }

    async function saveLevelOrder() {
      const order = rankedLevels.map(l => l.id);
      try {
        const data = await api('/levels', {
          method: 'PUT',
          body: JSON.stringify({ order })
        });
        rankedLevels = data.levels || rankedLevels;
        renderLevels();
      } catch (err) {
        setLevelStatus(err.message || 'Failed to save order', 'error');
        await loadLevels();
      }
    }

    function onDragStart(e, index) {
      if (!isAdmin) return;
      dragSrcIndex = index;
      e.currentTarget.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', index);
    }
    function onDragOver(e, index) {
      if (!isAdmin) return;
      e.preventDefault();
      document.querySelectorAll('.rank-item').forEach(el => el.classList.remove('drag-over'));
      e.currentTarget.classList.add('drag-over');
    }
    function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    function onDrop(e, index) {
      if (!isAdmin) return;
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      if (dragSrcIndex === null || dragSrcIndex === index) return;
      const item = rankedLevels.splice(dragSrcIndex, 1)[0];
      rankedLevels.splice(index, 0, item);
      dragSrcIndex = null;
      renderLevels();
      saveLevelOrder();
    }
    function onDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.rank-item').forEach(el => el.classList.remove('drag-over'));
      dragSrcIndex = null;
    }

    function renderLevels() {
      if (!rankedLevels.length) {
        levelContent.innerHTML = `<div class="empty">${isAdmin ? 'Search for a level and add it to start your ranking.' : 'No levels ranked yet.'}</div>`;
        return;
      }
      levelContent.innerHTML = `
        <ul class="ranked-list">
          ${rankedLevels.map((lv, i) => `
            <li class="rank-item ${isAdmin ? 'draggable' : ''}"
                ${isAdmin ? `draggable="true" ondragstart="onDragStart(event,${i})" ondragover="onDragOver(event,${i})" ondragleave="onDragLeave(event)" ondrop="onDrop(event,${i})" ondragend="onDragEnd(event)"` : ''}>
              ${isAdmin ? '<span class="drag-handle" title="Drag to reorder">⠿</span>' : ''}
              <span class="rank-pos ${posClass(i)}">${i + 1}</span>
              <div class="rank-info">
                <div class="rank-name">${escapeHtml(lv.name)}</div>
                <div class="rank-meta">
                  by ${escapeHtml(lv.author || '?')}
                  ${lv.difficulty ? ' · ' + escapeHtml(lv.difficulty) : ''}
                  ${lv.stars != null ? ' · ' + lv.stars + '★' : ''}
                  · ID ${lv.level_id}
                </div>
              </div>
              ${isAdmin ? `<button class="btn-danger" onclick="removeLevel('${escapeAttr(lv.id)}')">Remove</button>` : ''}
            </li>
          `).join('')}
        </ul>`;
    }

    // ===== Events =====
    document.getElementById('addForm').addEventListener('submit', e => {
      e.preventDefault();
      addUser(document.getElementById('usernameInput').value);
    });
    document.getElementById('refreshBtn').addEventListener('click', refreshAll);
    document.getElementById('sortSelect').addEventListener('change', e => {
      sortKey = e.target.value;
      renderFriends();
    });
    document.getElementById('btnCards').addEventListener('click', () => {
      viewMode = 'cards';
      document.getElementById('btnCards').classList.add('active');
      document.getElementById('btnTable').classList.remove('active');
      renderFriends();
    });
    document.getElementById('btnTable').addEventListener('click', () => {
      viewMode = 'table';
      document.getElementById('btnTable').classList.add('active');
      document.getElementById('btnCards').classList.remove('active');
      renderFriends();
    });
    document.getElementById('levelSearchInput').addEventListener('input', () => {
      selectedLevel = null;
      document.getElementById('addLevelBtn').disabled = true;
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => searchLevels(document.getElementById('levelSearchInput').value.trim()), 350);
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('.level-search-wrap')) {
        document.getElementById('searchResults').classList.remove('show');
      }
    });
    document.getElementById('addLevelBtn').addEventListener('click', addLevelAtPosition);

    window.removeUser = removeUser;
    window.removeLevel = removeLevel;
    window.onDragStart = onDragStart;
    window.onDragOver = onDragOver;
    window.onDragLeave = onDragLeave;
    window.onDrop = onDrop;
    window.onDragEnd = onDragEnd;

    // ===== Init =====
    (async () => {
      // Restore admin session if token still valid (will fail on first write if expired)
      if (token()) setAdminUI(true);
      else setAdminUI(false);

      await Promise.all([loadFriends(), loadLevels()]);

      // If empty friends and we have admin, seed was attempted in loadFriends
      if (friends.length === 0 && !isAdmin) {
        content.innerHTML = '<div class="empty">No friends listed yet. Ask the admin to add some!</div>';
      }

      await liveRefresh();
      setInterval(() => {
        if (document.visibilityState === 'visible') liveRefresh({ quiet: true });
      }, 120000);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') liveRefresh({ quiet: true });
      });
    })();
  </script>
</body>
</html>
